server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $backend http://api:8080;
    proxy_pass $backend;
    proxy_buffering off;
  }
  location / { try_files $uri $uri/ /index.html; }
}

name: verify
# Pull request verification runs on the GitHub organization mirror
# (.github/workflows/mirror-ci.yml) and reports back as
# "GitHub CI / Mirror CI gate". This workflow verifies and deploys main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This workflow deploys; never cancel a run that may be mid-deploy.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dedhed
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dedhed_test
        options: --label dedhed.ci-database=${{ github.run_id }}-${{ github.run_attempt }} --health-cmd "pg_isready -U dedhed -d dedhed_test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
          run_install: false
      - name: Verify with this run's disposable database
        env:
          TEST_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The configured runner uses Docker bridge without service DNS.
          # Resolve exactly this run's labeled service, never a shared alias.
          [[ "$TEST_DATABASE_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          test_db_id=$(docker ps --no-trunc --quiet --filter "label=dedhed.ci-database=$TEST_DATABASE_RUN")
          if ! [[ "$test_db_id" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Expected exactly one database container for this run' >&2
            exit 1
          fi
          test_db_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$test_db_id")
          if ! [[ "$test_db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'Expected exactly one IPv4 address for the job database' >&2
            exit 1
          fi
          export TEST_DATABASE_URL="postgres://dedhed:disposable-ci-only@$test_db_ip:5432/dedhed_test?sslmode=disable"
          make verify

  frontend:
    name: Deploy public frontend to Almaz
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reuse an already accepted frontend artifact
        id: artifact
        if: github.server_url == 'https://git.subcult.tv' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.200)
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          python3 - "$deploy_dir/artifact.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          available = info.get("available") is True
          if available:
              assert re.fullmatch(r"[0-9a-f]{64}", info.get("html_sha256", ""))
          with Path(sys.argv[2]).open("a") as output:
              output.write("available=" + str(available).lower() + "\n")
          PYCODE
      - name: Build deployable images from the verified revision
        if: steps.artifact.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/dedhed/web:$DEPLOY_REVISION"
          docker build --build-arg VITE_DEDHED_AUDIENCE=public -f web/Dockerfile --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/dedhed" -t "$image" web
          docker run --rm --network none --add-host api:127.0.0.1 --entrypoint nginx "$image" -t
      - name: Publish the verified frontend and existing API role image
        if: >-
          github.server_url == 'https://git.subcult.tv' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.artifact.outputs.available != 'true'
        shell: bash
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          REGISTRY: git.subcult.tv/subculture-collective
        run: |
          set -euo pipefail
          test -n "$REGISTRY_PAT"
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          chmod 700 "$auth_dir"
          export DOCKER_BUILDKIT=1 DOCKER_CONFIG="$auth_dir/docker"
          docker tag "fleet-deploy/dedhed/web:$DEPLOY_REVISION" "$REGISTRY/dedhed-web-public:$DEPLOY_REVISION"
          docker build -f backend/Dockerfile --label "org.opencontainers.image.revision=$DEPLOY_REVISION" -t "$REGISTRY/dedhed-api:$DEPLOY_REVISION" .
          printf '%s' "$REGISTRY_PAT" | docker login git.subcult.tv --username subcult-agent --password-stdin
          for image in "$REGISTRY/dedhed-web-public:$DEPLOY_REVISION" "$REGISTRY/dedhed-api:$DEPLOY_REVISION"; do
            docker push "$image"
            printf 'published %s\n' "$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          done
      - name: Deploy the built image and verify public HTML
        if: >-
          github.server_url == 'https://git.subcult.tv' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REUSE_ARTIFACT: ${{ steps.artifact.outputs.available }}
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.200)
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/dedhed/web:$DEPLOY_REVISION"
          # The forced receiver accepts a full hexadecimal revision; expand it here.
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            # shellcheck disable=SC2029
            docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION web"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION web" > "$deploy_dir/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$deploy_dir/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://dedhed.subcult.tv/ > "$deploy_dir/live.html"
          actual=$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"

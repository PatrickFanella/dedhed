name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dedhed
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dedhed_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U dedhed" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dedhed:disposable-ci-only@localhost:5432/dedhed_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.33.0 --force
      - run: make verify

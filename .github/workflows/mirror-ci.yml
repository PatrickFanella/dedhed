name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    branches-ignore: [main]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    if: github.repository == 'subculture-collective/dedhed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dedhed
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: dedhed_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dedhed -d dedhed_test"
          --health-interval 5s --health-retries 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.26.11'
        cache: true
        cache-dependency-path: backend/go.sum
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install pnpm 10.33.0
      run: |
        set -euo pipefail
        npm install --global pnpm@10.33.0
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - name: Restore the pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}
    - name: Verify with this job's disposable database
      env:
        # Hosted runners publish the service container on loopback.
        TEST_DATABASE_URL: postgres://dedhed:disposable-ci-only@127.0.0.1:5432/dedhed_test?sslmode=disable
      run: make verify
  web-image:
    name: Public frontend image
    if: github.repository == 'subculture-collective/dedhed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Build the public frontend image and check its nginx config
      env:
        REVISION: ${{ github.sha }}
      run: |
        set -euo pipefail
        image="fleet-deploy/dedhed/web:$REVISION"
        docker build --build-arg VITE_DEDHED_AUDIENCE=public -f web/Dockerfile --label "org.opencontainers.image.revision=$REVISION" \
          --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/dedhed" -t "$image" web
        docker run --rm --network none --add-host api:127.0.0.1 --entrypoint nginx "$image" -t
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/dedhed'
    needs:
    - verify
    - web-image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'verify', 'web-image'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
